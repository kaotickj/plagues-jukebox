plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.kaosium.kaostunes'
    compileSdk 35
    defaultConfig {
        applicationId 'com.kaosium.kaostunes'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '0.1.1'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'com.kaosium.kaostunes.AndroidSmokeInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            def testKeyPath = System.getenv('JUKEBOX_DEBUG_KEYSTORE')
            def existingTestKey = testKeyPath ? file(testKeyPath) : file('../signing/kaostunes-test.keystore')
            if (existingTestKey.isFile()) {
                storeFile existingTestKey
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    signingConfigs {
        release {
            def keystorePath = System.getenv('KTUNES_RELEASE_KEYSTORE')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('KTUNES_KEYSTORE_PASSWORD')
                keyAlias System.getenv('KTUNES_KEY_ALIAS')
                keyPassword System.getenv('KTUNES_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KTUNES_RELEASE_KEYSTORE')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

chaquopy {
    defaultConfig { version = '3.12' }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    testImplementation 'junit:junit:4.13.2'
}
